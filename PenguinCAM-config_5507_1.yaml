# PenguinCAM Team Configuration (Version 2)
# This file defines machine-specific settings and machining preferences
#
# VERSION 2 FEATURES:
# - Support for multiple machines with different settings
# - Each machine can have its own materials with custom feeds/speeds
# - Machine-specific dimensions, tooling, and preferences
#
# All values are optional - any missing values will use Team 6238 defaults.

# =============================================================================
# CONFIG VERSION AND DEFAULT MACHINE
# =============================================================================
version: 2

# Which machine to use by default (if not specified in UI)
default_machine: shapeoko

# =============================================================================
# TEAM INFORMATION (applies to all machines)
# =============================================================================
team:
  number: 5507
  name: "Robotic Eagles"

# =============================================================================
# MACHINES
# =============================================================================
# Define each machine your team uses. Each can have different:
# - Work envelope dimensions
# - Feeds/speeds for each material (based on machine rigidity)
# - Default tooling
# - Controller settings

machines:
  # -------------------------------------------------------------------------
  # MACHINE 1: Shapeoko 3 XL
  # -------------------------------------------------------------------------
  shapeoko:
    name: "Shapeoko 3 XL"

    # Machine specifications
    machine:
      manufacturer: "Shapeoko 3"
      controller: "GRBL"

      # Machine work envelope (inches)
      dimensions:
        x_max: 32
        y_max: 15
        z_max: 3

      # Park position (machine coordinates for safe part access)
      park_position:
        x: -0.5     # X position when parking (machine coords)
        y: -0.5     # Y position when parking (machine coords)
        z: -0.5     # Z position for safe clearance (machine coords, negative = below home)

      # Coordinate systems
      standard_work_offset: "G54"       # Work offset for standard operations
      tube_jig_work_offset: "G55"       # Work offset for tube jig operations

      coolant: "None"                    # Air, Flood, Mist, None

    # Default tooling for this machine
    default_tool:
      diameter: 0.125                   # 1/8" end mill (inches)

    # General machining preferences
    machining:
      # Z-axis reference system
      z_reference:
        sacrifice_board_depth: 0.008    # How far to cut into sacrifice board (inches)
        clearance_height: 0.5           # Clearance above material for rapid moves (inches)

      # Tab parameters (for perimeter operations)
      tabs:
        enabled: true                   # Whether to use tabs at all
        width: 0.25                     # Default tab width (inches)
        height: 0.15                    # Default tab height (inches)
        remove_tabs: true               # Automatically remove tabs at end of job

      # Hole detection
      holes:
        detection_tolerance: 0.0001     # Tolerance for detecting circular holes (inches)
        min_millable_multiplier: 1.2    # Minimum hole diameter as multiple of tool diameter

      # Fixturing options
      fixturing:
        pause_before_perimeter: true   # M0 pause before perimeter for screw fixturing

      # Pocket/hole contouring (for large internal through-cuts)
      pockets:
        # Contour threshold: feature area in multiples of tool cross-section (at 100% stepover)
        # Actual threshold scales directly with stepover (tighter stepover = lower area threshold)
        # Formula: threshold_area = contour_threshold × tool_diameter² × stepover_percentage
        # Applies to both irregular pockets AND large circular holes
        # IMPORTANT: Only applies to through-cuts (features cutting to sacrifice board at Z=0)
        #            Partial-depth features are ALWAYS fully cleared (need flat bottoms)
        # Large through-cut features are contoured instead of fully cleared to save machining time
        # Note: Contoured features require manual post-processing to remove the tab-held center
        # Set to 0 to disable contouring entirely (always fully clear all pockets/holes)
        contour_threshold: 510          # Default: 510 (aluminum: ~2.0" dia, plywood: ~3.2" dia, polycarbonate: ~3.0" dia)

    # Tube facing parameters (for aluminum tube operations)
    tube_facing:
      depth_margin: 0.005               # Extra depth beyond half tube height (inches)
      max_roughing_depth: 0.3           # Maximum depth per roughing pass (inches)
      max_finishing_depth: 0.51         # Maximum depth per finishing pass (inches)

      phase_1:
        roughing_tool_edge: 0.05        # Phase 1 roughing position (inches)
        finishing_tool_edge: 0.0625     # Phase 1 finishing position (inches)

      phase_2:
        roughing_tool_edge: -0.0125     # Phase 2 roughing position (inches)
        finishing_tool_edge: 0.0        # Phase 2 finishing position (inches)

      arc_advance: 0.04                 # Arc advance distance in X (inches)
      arc_radius: 0.05                  # Arc radius for clearing moves (inches)

    # Material-specific settings for THIS MACHINE
    # Desktop mill with low rigidity - slow speeds
    materials:
      aluminum:
        name: "Aluminum - 6061 - second test"
        description: "Aluminum - 23K RPM, 10.2 IPM cutting, 4 deg ramp"

        spindle_speed: 23000            # RPM
        feed_rate: 10.3                 # Cutting feed rate (IPM)
        ramp_feed_rate: 10.3            # Ramp feed rate (IPM)
        plunge_rate: 2.9                # Plunge feed rate for tab Z moves (IPM)
        traverse_rate: 200.0            # Lateral moves above material (IPM)
        approach_rate: 35.0             # Z approach to ramp start (IPM)

        ramp_angle: 4.0                 # Ramp angle in degrees
        ramp_start_clearance: 0.050     # Clearance above material to start ramping (inches)
        stepover_percentage: 0.25       # Radial stepover as fraction of tool diameter
        helix_radius_multiplier: 0.5    # Helix entry radius as fraction of tool radius
        max_slotting_depth: 0.125       # Maximum depth per pass for perimeter slotting (inches)
        peck_drill_depth: 0.05          # Peck depth for G83 drilling small holes (inches)

        tab_width: 0.25
        tab_height: 0.15

    # Integrations (Google Drive, etc.)
    integrations:
      google_drive:
        enabled: false
        # folder_id: "your_folder_id_here"  # Get from Drive folder URL


# =============================================================================
# NOTES
# =============================================================================
# - To use this config, upload it to the root of your Onshape document tree
# - as "PenguinCAM-config.yaml" and make sure it is shared with your classroom
# - AND with the PenguinCAM app.
#
# - The machine selector will appear in the UI if you have multiple machines
# - Each machine can have completely different feeds/speeds based on rigidity
# - You can add custom materials to any machine
# - V1 configs (without "version: 2") still work and are treated as single machine
